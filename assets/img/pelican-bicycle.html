<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑自行车 · 2D SVG 动画</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; display:block; padding:0;
    background:
      radial-gradient(90% 70% at 50% -10%, #23405f 0%, #101d2c 45%, #070b11 100%);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .stage{
    width:100%; height:100%;
    border-radius:0;
    overflow:hidden;
    background:#cfeaff;
    box-shadow:
      0 44px 90px -34px rgba(0,0,0,.9),
      0 0 0 1px rgba(255,255,255,.10),
      inset 0 0 0 1px rgba(8,18,30,.05);
  }
  svg.scene{display:block; width:100%; height:100%}
</style>
</head>
<body>

<div class="stage">
<svg class="scene" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="一只鹈鹕骑着自行车向前行进的动画">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#96d3fb"/>
      <stop offset="55%"  stop-color="#d6f0ff"/>
      <stop offset="100%" stop-color="#f5fcff"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffe38f" stop-opacity=".95"/>
      <stop offset="55%"  stop-color="#ffd76b" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#ffd76b" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#a6b0bd"/>
      <stop offset="55%"  stop-color="#8b95a2"/>
      <stop offset="100%" stop-color="#737d8a"/>
    </linearGradient>

    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="68%"  stop-color="#f3f7fc"/>
      <stop offset="100%" stop-color="#e0e9f4"/>
    </linearGradient>

    <linearGradient id="wingGrad" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%"   stop-color="#fdfeff"/>
      <stop offset="100%" stop-color="#d9e4f0"/>
    </linearGradient>

    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffd35e"/>
      <stop offset="100%" stop-color="#f39c17"/>
    </linearGradient>

    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffc766"/>
      <stop offset="100%" stop-color="#ea8a1e"/>
    </linearGradient>

    <!-- 云朵：三团圆 + 一条圆角底座 -->
    <g id="cloudShape">
      <circle cx="0"  cy="0"  r="17"/>
      <circle cx="23" cy="-9" r="23"/>
      <circle cx="51" cy="1"  r="15"/>
      <rect x="-17" y="1" width="86" height="18" rx="9"/>
    </g>

    <!-- 远景丘陵，宽 800，可无缝平铺 -->
    <g id="hillFarTile">
      <path d="M0,432 C 72,386 146,384 214,408 C 276,430 322,402 392,390
               C 462,378 522,398 582,414 C 642,430 726,412 800,432 Z"
            fill="#b6ddcb"/>
    </g>

    <!-- 近景丘陵 + 灌木，宽 800，可无缝平铺 -->
    <g id="hillNearTile">
      <path d="M0,432 C 62,408 112,410 162,422 C 214,434 252,412 302,408
               C 362,403 412,422 472,426 C 532,430 572,412 632,414
               C 692,416 744,426 800,432 Z"
            fill="#8fca87"/>
      <g fill="#7ab86f">
        <ellipse cx="150" cy="425" rx="15" ry="10"/>
        <ellipse cx="468" cy="425" rx="19" ry="12"/>
        <ellipse cx="702" cy="427" rx="12" ry="9"/>
      </g>
    </g>

    <!-- 小飞鸟 -->
    <g id="birdShape" fill="none" stroke="#54728f" stroke-width="2.6"
       stroke-linecap="round" opacity=".5">
      <path d="M0,0 q7,-6 14,0 q7,-6 14,0"/>
    </g>
  </defs>

  <!-- ============ 天空 ============ -->
  <rect x="0" y="0" width="800" height="500" fill="url(#skyGrad)"/>

  <!-- 太阳 -->
  <g id="sun">
    <g id="sunRays"></g>
    <circle cx="118" cy="92" r="55" fill="url(#sunGlow)"/>
    <circle cx="118" cy="92" r="26" fill="#ffdc78"/>
  </g>

  <!-- 云 -->
  <g id="clouds" fill="#ffffff" opacity=".92">
    <use href="#cloudShape" data-drift data-x="70"  data-y="72"  data-s="1.00" data-v="10"
         transform="translate(70 72) scale(1)"/>
    <use href="#cloudShape" data-drift data-x="300" data-y="116" data-s="0.70" data-v="15"
         transform="translate(300 116) scale(0.7)"/>
    <use href="#cloudShape" data-drift data-x="500" data-y="58"  data-s="0.86" data-v="8"
         transform="translate(500 58) scale(0.86)"/>
    <use href="#cloudShape" data-drift data-x="690" data-y="104" data-s="1.12" data-v="12"
         transform="translate(690 104) scale(1.12)"/>
    <use href="#cloudShape" data-drift data-x="840" data-y="64"  data-s="0.58" data-v="18"
         transform="translate(840 64) scale(0.58)"/>
  </g>

  <!-- 远处的小鸟 -->
  <g id="birds">
    <use href="#birdShape" data-drift data-x="250" data-y="140" data-s="1.0" data-v="26"
         transform="translate(250 140) scale(1)"/>
    <use href="#birdShape" data-drift data-x="286" data-y="128" data-s="0.8" data-v="26"
         transform="translate(286 128) scale(0.8)"/>
    <use href="#birdShape" data-drift data-x="318" data-y="148" data-s="0.9" data-v="26"
         transform="translate(318 148) scale(0.9)"/>
  </g>

  <!-- ============ 背景 ============ -->
  <g id="hillsFar">
    <use href="#hillFarTile" x="-800"/>
    <use href="#hillFarTile" x="0"/>
    <use href="#hillFarTile" x="800"/>
    <use href="#hillFarTile" x="1600"/>
  </g>

  <g id="hillsNear">
    <use href="#hillNearTile" x="-800"/>
    <use href="#hillNearTile" x="0"/>
    <use href="#hillNearTile" x="800"/>
    <use href="#hillNearTile" x="1600"/>
  </g>

  <!-- ============ 路面 ============ -->
  <rect x="0" y="432" width="800" height="68" fill="url(#roadGrad)"/>
  <rect x="0" y="432" width="800" height="3" fill="#eef4fa" opacity=".85"/>
  <g id="roadDashes" fill="#f3f7fb" opacity=".88"></g>

  <!-- 速度线 -->
  <g id="wind" stroke="#ffffff" stroke-linecap="round" opacity=".55"></g>

  <!-- 车底阴影 -->
  <ellipse cx="410" cy="434" rx="168" ry="10" fill="#22303f" opacity=".20"/>

  <!-- ============ 自行车 + 鹈鹕 ============ -->
  <g id="bike">

    <!-- 后轮 -->
    <g id="wheelRear">
      <circle cx="298" cy="380" r="52" fill="none" stroke="#2b323d" stroke-width="9"/>
      <circle cx="298" cy="380" r="45" fill="none" stroke="#cbd4df" stroke-width="3"/>
      <g id="spokesRear" stroke="#e6ecf3" stroke-width="1.6" opacity=".95"></g>
      <circle cx="298" cy="380" r="6.5" fill="#96a3b1" stroke="#6e7a88" stroke-width="2"/>
    </g>

    <!-- 前轮 -->
    <g id="wheelFront">
      <circle cx="520" cy="380" r="52" fill="none" stroke="#2b323d" stroke-width="9"/>
      <circle cx="520" cy="380" r="45" fill="none" stroke="#cbd4df" stroke-width="3"/>
      <g id="spokesFront" stroke="#e6ecf3" stroke-width="1.6" opacity=".95"></g>
      <circle cx="520" cy="380" r="6.5" fill="#96a3b1" stroke="#6e7a88" stroke-width="2"/>
    </g>

    <!-- 远侧腿（在车架后面） -->
    <g id="legFar" stroke-linecap="round">
      <line id="farThigh" stroke="#cfd9e4" stroke-width="16"/>
      <line id="farShin"  stroke="#d0842a" stroke-width="8"/>
      <circle id="farKnee" r="7" fill="#d0842a"/>
      <g id="farPedal">
        <rect x="-12" y="-3.5" width="24" height="7" rx="3" fill="#20262f"/>
      </g>
      <g id="farFoot">
        <path d="M-6,-9 q11,-4 21,3 l2,5 q-9,4 -21,1 z" fill="#d0842a"/>
      </g>
    </g>

    <!-- 车架 -->
    <g id="frame" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#2f4f73" stroke-width="7">
        <path d="M362 286 L412 382"/>          <!-- 座管 -->
        <path d="M362 286 L500 272"/>          <!-- 上管 -->
        <path d="M412 382 L510 300"/>          <!-- 下管 -->
        <path d="M500 272 L510 300"/>          <!-- 头管 -->
        <path d="M298 380 L412 382"/>          <!-- 后下叉 -->
        <path d="M298 380 L362 286"/>          <!-- 后上叉 -->
      </g>
      <g stroke="#3f6288" stroke-width="6">
        <path d="M510 300 L520 380"/>          <!-- 前叉 -->
        <path d="M500 272 L516 256"/>          <!-- 立管 -->
        <path d="M516 256 C 526 249 539 253 543 263"/>  <!-- 车把 -->
      </g>
    </g>

    <!-- 车座 -->
    <path d="M340 279 C 348 270 372 269 381 276 C 388 281 386 288 375 288
             L348 288 C 339 288 335 284 340 279 Z" fill="#39424f"/>

    <!-- 把套 -->
    <rect x="536" y="258" width="13" height="10" rx="5" fill="#c98a45"
          transform="rotate(-18 542 263)"/>

    <!-- 链条 -->
    <g id="chain" stroke="#69737f" stroke-width="3" fill="none" stroke-dasharray="5 4">
      <path d="M412 367 L298 373"/>
      <path d="M412 397 L298 387"/>
    </g>
    <circle cx="412" cy="382" r="15" fill="none" stroke="#3d4652" stroke-width="4"/>
    <circle cx="298" cy="380" r="8" fill="#3d4652"/>

    <!-- 曲柄 + 牙盘中心 -->
    <g id="crankArms" stroke="#4a5563" stroke-width="6" stroke-linecap="round">
      <line x1="412" y1="382" x2="434" y2="382"/>
      <line x1="412" y1="382" x2="390" y2="382"/>
    </g>
    <circle cx="412" cy="382" r="5" fill="#7d8794"/>

    <!-- 近侧踏板 -->
    <g id="nearPedal">
      <rect x="-12" y="-3.5" width="24" height="7" rx="3" fill="#2b323d"/>
    </g>

    <!-- 近侧腿（在车架前面） -->
    <g id="legNear" stroke-linecap="round">
      <line id="nearThigh" stroke="#eef4fa" stroke-width="17"/>
      <line id="nearShin"  stroke="#f2a03d" stroke-width="9"/>
      <circle id="nearKnee" r="8" fill="#f2a03d"/>
      <g id="nearFoot">
        <path d="M-6,-9 q11,-4 21,3 l2,5 q-9,4 -21,1 z" fill="#f2a03d"
              stroke="#dd8a26" stroke-width="1.2" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- ============ 鹈鹕 ============ -->
  <g id="pelican">
    <g id="pelicanBob">

      <!-- 尾羽 -->
      <path d="M322 232 L262 221 L302 245 L257 254 L316 265 Z"
            fill="#e9eff7" stroke="#d7e1ec" stroke-width="2" stroke-linejoin="round"/>

      <!-- 身体 -->
      <ellipse cx="372" cy="254" rx="66" ry="50" transform="rotate(-8 372 254)"
               fill="url(#bodyGrad)" stroke="#dbe4ee" stroke-width="2"/>
      <path d="M318 280 C 344 304 396 306 420 284 C 400 300 350 300 318 280 Z"
            fill="#dde6f1" opacity=".5"/>

      <!-- 收起的翅膀 -->
      <path d="M414 232 C 388 236 352 254 336 276 C 346 294 384 300 404 284
               C 424 268 428 246 414 232 Z"
            fill="url(#wingGrad)" stroke="#d7e1ec" stroke-width="2"/>
      <path d="M350 272 C 366 280 386 276 398 262
               M356 286 C 372 292 390 288 402 274
               M364 262 C 378 270 392 266 402 254"
            fill="none" stroke="#cfdae7" stroke-width="2" stroke-linecap="round"/>

      <!-- 脖子 -->
      <path d="M392 228 C 400 188 420 162 452 158" fill="none"
            stroke="#dbe4ee" stroke-width="37" stroke-linecap="round"/>
      <path d="M392 228 C 400 188 420 162 452 158" fill="none"
            stroke="#fafcfe" stroke-width="32" stroke-linecap="round"/>

      <!-- 头 + 喙（会轻微点头） -->
      <g id="headGrp">
        <!-- 头顶小冠羽 -->
        <path d="M452 138 C 440 120 448 108 460 114 C 454 122 458 130 464 134 Z"
              fill="#e7eef7" stroke="#d7e1ec" stroke-width="1.5"/>

        <ellipse cx="470" cy="156" rx="29" ry="25" transform="rotate(-8 470 156)"
                 fill="#fafcfe" stroke="#dbe4ee" stroke-width="2"/>

        <!-- 上喙 -->
        <path d="M490 148 C 530 152 572 159 606 171 C 603 177 597 180 590 179
                 C 556 172 520 167 489 162 Z"
              fill="url(#beakGrad)" stroke="#d98a1f" stroke-width="1.6"
              stroke-linejoin="round"/>

        <!-- 喉囊 -->
        <path d="M489 159 C 493 193 514 212 544 207 C 572 203 592 189 602 174
                 C 566 180 522 170 489 159 Z"
              fill="url(#pouchGrad)" stroke="#d98a1f" stroke-width="1.6"
              stroke-linejoin="round"/>
        <line x1="516" y1="160" x2="528" y2="162" stroke="#c97d18"
              stroke-width="2" stroke-linecap="round"/>

        <!-- 眼睛 -->
        <circle cx="481" cy="146" r="4.6" fill="#24303f"/>
        <circle cx="482.6" cy="144.4" r="1.5" fill="#ffffff"/>
      </g>

      <!-- 伸向车把的翅膀 -->
      <path d="M420 232 C 452 238 496 250 528 257 C 540 260 541 271 529 273
               C 496 271 452 263 424 253 C 412 248 409 236 420 232 Z"
            fill="url(#wingGrad)" stroke="#d7e1ec" stroke-width="2"/>
      <path d="M512 262 C 520 265 528 267 534 267
               M508 270 C 516 271 524 272 530 272"
            fill="none" stroke="#cfdae7" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
</div>

<script>
(function () {
  "use strict";

  var TAU = Math.PI * 2;
  var SVGNS = "http://www.w3.org/2000/svg";
  var $ = function (id) { return document.getElementById(id); };

  /* ---------------- 几何参数 ---------------- */
  var BB     = { x: 412, y: 382 };   // 中轴
  var CRANK  = 22;                   // 曲柄长度
  var REAR   = { x: 298, y: 380 };   // 后轴
  var FRONT  = { x: 520, y: 380 };   // 前轴
  var HIP    = { x: 368, y: 288 };   // 髋关节（随身体起伏）
  var L1 = 62, L2 = 66;              // 大腿 / 小腿

  /* ---------------- 元素引用 ---------------- */
  var spokesRear   = $("spokesRear");
  var spokesFront  = $("spokesFront");
  var crankArms    = $("crankArms");
  var nearPedal    = $("nearPedal");
  var farPedal     = $("farPedal");
  var nearFoot     = $("nearFoot");
  var farFoot      = $("farFoot");
  var nearThigh    = $("nearThigh");
  var nearShin     = $("nearShin");
  var nearKnee     = $("nearKnee");
  var farThigh     = $("farThigh");
  var farShin      = $("farShin");
  var farKnee      = $("farKnee");
  var pelicanBob   = $("pelicanBob");
  var headGrp      = $("headGrp");
  var chain        = $("chain");
  var sunRays      = $("sunRays");
  var roadDashes   = $("roadDashes");
  var hillsFar     = $("hillsFar");
  var hillsNear    = $("hillsNear");
  var wind         = $("wind");

  /* ---------------- 生成轮辐（带一颗彩色气门芯，方便看转速） ------- */
  function buildSpokes(hub, group) {
    var html = "";
    for (var i = 0; i < 12; i++) {
      var a = (i / 12) * TAU + 0.13;
      var x1 = (hub.x + Math.cos(a) * 7).toFixed(1);
      var y1 = (hub.y + Math.sin(a) * 7).toFixed(1);
      var x2 = (hub.x + Math.cos(a) * 44).toFixed(1);
      var y2 = (hub.y + Math.sin(a) * 44).toFixed(1);
      html += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"/>';
    }
    html += '<circle cx="' + hub.x + '" cy="' + (hub.y - 31) +
            '" r="3.6" fill="#e05a47" stroke="none"/>';
    group.innerHTML = html;
  }
  buildSpokes(REAR, spokesRear);
  buildSpokes(FRONT, spokesFront);

  /* ---------------- 太阳光芒 ---------------- */
  (function () {
    var html = "";
    for (var i = 0; i < 12; i++) {
      var a = (i / 12) * TAU;
      var x1 = 118 + Math.cos(a) * 33, y1 = 92 + Math.sin(a) * 33;
      var x2 = 118 + Math.cos(a) * 49, y2 = 92 + Math.sin(a) * 49;
      html += '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) +
              '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '"/>';
    }
    sunRays.innerHTML = html;
    sunRays.setAttribute("stroke", "#ffd76b");
    sunRays.setAttribute("stroke-width", "3");
    sunRays.setAttribute("stroke-linecap", "round");
    sunRays.setAttribute("opacity", "0.65");
  })();

  /* ---------------- 路面虚线 ---------------- */
  (function () {
    var html = "";
    for (var i = 0; i < 9; i++) {
      html += '<rect x="' + (-120 + i * 120) + '" y="453" width="58" height="8" rx="4"/>';
    }
    roadDashes.innerHTML = html;
  })();

  /* ---------------- 速度线 ---------------- */
  var windSpecs = [
    { y: 210, len: 54, v: 620, off: 0   },
    { y: 258, len: 38, v: 700, off: 260 },
    { y: 300, len: 64, v: 560, off: 520 },
    { y: 336, len: 42, v: 760, off: 130 },
    { y: 176, len: 30, v: 520, off: 700 },
    { y: 372, len: 58, v: 640, off: 380 }
  ];
  var windEls = windSpecs.map(function (s) {
    var ln = document.createElementNS(SVGNS, "line");
    ln.setAttribute("y1", s.y);
    ln.setAttribute("y2", s.y);
    ln.setAttribute("stroke-width", 4);
    wind.appendChild(ln);
    return ln;
  });

  /* ---------------- 视差漂移元素（云 / 鸟） ---------------- */
  var drift = [];
  Array.prototype.forEach.call(document.querySelectorAll("[data-drift]"), function (el) {
    drift.push({
      el: el,
      x: parseFloat(el.getAttribute("data-x")),
      y: parseFloat(el.getAttribute("data-y")),
      s: parseFloat(el.getAttribute("data-s")),
      v: parseFloat(el.getAttribute("data-v"))
    });
  });

  var SPAN = 1000, MINX = -170;
  function wrapX(x) {
    return ((x - MINX) % SPAN + SPAN) % SPAN + MINX;
  }

  /* ---------------- 两段式腿部 IK ---------------- */
  function solveKnee(hip, foot) {
    var dx = foot.x - hip.x, dy = foot.y - hip.y;
    var dist = Math.sqrt(dx * dx + dy * dy) || 0.0001;
    var d = Math.min(Math.max(dist, Math.abs(L1 - L2) + 0.5), L1 + L2 - 0.5);
    var ux = dx / dist, uy = dy / dist;
    var a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    var bx = hip.x + ux * a, by = hip.y + uy * a;
    // 两个解：膝盖朝前（x 更大）的那个
    var k1 = { x: bx - uy * h, y: by + ux * h };
    var k2 = { x: bx + uy * h, y: by - ux * h };
    return k1.x > k2.x ? k1 : k2;
  }

  function setLeg(leg, hip, foot) {
    var knee = solveKnee(hip, foot);

    leg.thigh.setAttribute("x1", hip.x.toFixed(1));
    leg.thigh.setAttribute("y1", hip.y.toFixed(1));
    leg.thigh.setAttribute("x2", knee.x.toFixed(1));
    leg.thigh.setAttribute("y2", knee.y.toFixed(1));

    leg.shin.setAttribute("x1", knee.x.toFixed(1));
    leg.shin.setAttribute("y1", knee.y.toFixed(1));
    leg.shin.setAttribute("x2", foot.x.toFixed(1));
    leg.shin.setAttribute("y2", foot.y.toFixed(1));

    leg.knee.setAttribute("cx", knee.x.toFixed(1));
    leg.knee.setAttribute("cy", knee.y.toFixed(1));

    leg.pedal.setAttribute("transform",
      "translate(" + foot.x.toFixed(1) + " " + foot.y.toFixed(1) + ")");
    leg.foot.setAttribute("transform",
      "translate(" + foot.x.toFixed(1) + " " + (foot.y - 4).toFixed(1) + ")");
  }

  var legNear = { thigh: nearThigh, shin: nearShin, knee: nearKnee,
                  foot: nearFoot, pedal: nearPedal };
  var legFar  = { thigh: farThigh,  shin: farShin,  knee: farKnee,
                  foot: farFoot,   pedal: farPedal  };

  /* ---------------- 主循环 ---------------- */
  var CRANK_SPEED = 5.4;    // rad/s
  var WHEEL_SPEED = 342;    // deg/s
  var ROAD_SPEED  = 300;    // px/s

  function render(t) {
    /* --- 踏频、车轮 --- */
    var crankAngle = t * CRANK_SPEED;
    var crankDeg   = crankAngle * 180 / Math.PI;
    crankArms.setAttribute("transform", "rotate(" + crankDeg.toFixed(2) + " 412 382)");

    var wheelDeg = (t * WHEEL_SPEED) % 360;
    spokesRear.setAttribute("transform", "rotate(" + wheelDeg.toFixed(2) + " 298 380)");
    spokesFront.setAttribute("transform", "rotate(" + wheelDeg.toFixed(2) + " 520 380)");

    /* --- 链条 --- */
    chain.setAttribute("stroke-dashoffset", (t * 46 % 9).toFixed(2));

    /* --- 身体起伏、点头 --- */
    var bob = Math.sin(crankAngle * 2) * 2.4;
    pelicanBob.setAttribute("transform", "translate(0 " + bob.toFixed(2) + ")");
    headGrp.setAttribute("transform",
      "rotate(" + (1.7 * Math.sin(crankAngle * 2 + 0.9)).toFixed(2) + " 452 160)");

    /* --- 踏板位置 --- */
    var cos = Math.cos(crankAngle), sin = Math.sin(crankAngle);
    var pNear = { x: BB.x + CRANK * cos, y: BB.y + CRANK * sin };
    var pFar  = { x: BB.x - CRANK * cos, y: BB.y - CRANK * sin };
    var hip   = { x: HIP.x, y: HIP.y + bob };

    setLeg(legNear, hip, pNear);
    setLeg(legFar,  hip, pFar);

    /* --- 风景滚动 --- */
    roadDashes.setAttribute("transform", "translate(" + (-(t * ROAD_SPEED) % 120).toFixed(2) + " 0)");
    hillsNear.setAttribute("transform", "translate(" + (-(t * 46) % 800).toFixed(2) + " 0)");
    hillsFar.setAttribute("transform",  "translate(" + (-(t * 18) % 800).toFixed(2) + " 0)");

    /* --- 太阳缓慢旋转 --- */
    sunRays.setAttribute("transform", "rotate(" + (t * 7).toFixed(2) + " 118 92)");

    /* --- 云和鸟 --- */
    for (var i = 0; i < drift.length; i++) {
      var it = drift[i];
      var x = wrapX(it.x - t * it.v);
      it.el.setAttribute("transform",
        "translate(" + x.toFixed(1) + " " + it.y + ") scale(" + it.s + ")");
    }

    /* --- 速度线 --- */
    for (var j = 0; j < windEls.length; j++) {
      var s = windSpecs[j];
      var span = 800 + s.len + 240;
      var wx = 860 - ((t * s.v + s.off) % span);
      windEls[j].setAttribute("x1", wx.toFixed(1));
      windEls[j].setAttribute("x2", (wx + s.len).toFixed(1));
      windEls[j].setAttribute("opacity",
        (0.10 + 0.30 * Math.max(0, Math.sin(((wx + s.len) / span) * Math.PI))).toFixed(3));
    }
  }

  /* ---------------- 启动 ---------------- */
  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    render((ts - start) / 1000);
    requestAnimationFrame(loop);
  }

  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    render(0.9);                      // 尊重"减少动态效果"：只画一帧
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>
