<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>鹈鹕骑车载着 DeepSeek 小蓝鲸</title>
<style>
  :root{
    color-scheme: light;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    height:100%; display:block; overflow:hidden;
    background:
      radial-gradient(120% 110% at 50% -10%, #f7fdff 0%, #e5f8ff 35%, #c5eaff 72%, #a9ddf7 100%);
    font-family: ui-rounded, "Nunito", "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .stage{ width:100%; height:100%; aspect-ratio:auto; border-radius:0; overflow:hidden; background:#cfeeff; }
  svg.scene{ display:block; width:100%; height:100%;
    user-select:none;
  }
</style>
</head>
<body>
<main class="stage">
<svg class="scene" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg"
     preserveAspectRatio="xMidYMid meet" role="img"
     aria-labelledby="sceneTitle sceneDesc">
  <title id="sceneTitle">鹈鹕骑自行车，载着一只 DeepSeek 小蓝鲸</title>
  <desc id="sceneDesc">一幅侧视的扁平卡通动画：白色鹈鹕戴着橙黄色大嘴，坐在酒红色自行车上，双翅握着车把，双脚跟着曲柄和踏板转动。车后货架上坐着一只圆胖的 DeepSeek 蓝鲸，鲸鱼头顶每 2.6 秒喷出一小股水珠。天空、白云、绿色丘陵和柏油路缓缓移动。开启“减少动态效果”时只绘制一帧静态画面。</desc>

  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fc8f3"/>
      <stop offset="35%" stop-color="#b7e6ff"/>
      <stop offset="70%" stop-color="#dcf5ff"/>
      <stop offset="100%" stop-color="#f6fdff"/>
    </linearGradient>

    <radialGradient id="sunHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ca" stop-opacity=".9"/>
      <stop offset="38%" stop-color="#fff1b0" stop-opacity=".36"/>
      <stop offset="100%" stop-color="#fff1b0" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f7fdff"/>
      <stop offset="100%" stop-color="#e5f6ff"/>
    </linearGradient>

    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aab5bf"/>
      <stop offset="45%" stop-color="#939eaa"/>
      <stop offset="100%" stop-color="#76838f"/>
    </linearGradient>

    <linearGradient id="framePaint" gradientUnits="userSpaceOnUse"
                    x1="430" y1="300" x2="510" y2="460">
      <stop offset="0%" stop-color="#b24b60"/>
      <stop offset="48%" stop-color="#963a50"/>
      <stop offset="100%" stop-color="#77293c"/>
    </linearGradient>

    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#f9fdff"/>
      <stop offset="100%" stop-color="#e1eff8"/>
    </linearGradient>

    <linearGradient id="wingGrad" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f4faff"/>
      <stop offset="100%" stop-color="#dbeaf3"/>
    </linearGradient>

    <linearGradient id="wingBackGrad" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#f6fbff"/>
      <stop offset="100%" stop-color="#d3e5f0"/>
    </linearGradient>

    <linearGradient id="beakGrad" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0%" stop-color="#ffd363"/>
      <stop offset="58%" stop-color="#ffbe43"/>
      <stop offset="100%" stop-color="#f3a028"/>
    </linearGradient>

    <linearGradient id="pouchGrad" x1="0.1" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#ffcd68"/>
      <stop offset="55%" stop-color="#fdb447"/>
      <stop offset="100%" stop-color="#ed8f28"/>
    </linearGradient>

    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".98"/>
      <stop offset="45%" stop-color="#d7f1ff" stop-opacity=".98"/>
      <stop offset="100%" stop-color="#78c9fa" stop-opacity=".96"/>
    </linearGradient>

    <filter id="shadowBlur" x="-80%" y="-160%" width="260%" height="420%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>

    <g id="cloudShape">
      <path d="M -72 20
               C -84 2 -67 -14 -49 -10
               C -47 -31 -18 -39 -3 -22
               C 11 -38 39 -33 44 -10
               C 65 -16 78 0 68 17
               C 52 24 20 26 -10 26
               C -35 26 -59 27 -72 20 Z"
            fill="url(#cloudGrad)"/>
      <path d="M -54 16 C -26 22 34 22 61 13" fill="none"
            stroke="#dff3fd" stroke-width="2.4" stroke-linecap="round" opacity=".7"/>
    </g>

    <!-- Repeating parallax hill tiles. Each tile starts and ends at the same height. -->
    <g id="hillFarTile">
      <path d="M 0 382
               C 68 336 148 310 228 340
               C 308 370 366 326 442 332
               C 518 338 584 374 660 382
               L 660 540 L 0 540 Z"
            fill="#c6e8d0"/>
      <path d="M 0 382
               C 68 336 148 310 228 340
               C 308 370 366 326 442 332
               C 518 338 584 374 660 382"
            fill="none" stroke="#def5e5" stroke-width="2.2"
            stroke-linecap="round" opacity=".55"/>
    </g>

    <g id="hillMidTile">
      <path d="M 0 416
               C 52 376 112 358 176 382
               C 244 408 286 354 356 362
               C 426 370 486 402 560 416
               L 560 540 L 0 540 Z"
            fill="#9bd6ab"/>
      <path d="M 0 416
               C 52 376 112 358 176 382
               C 244 408 286 354 356 362
               C 426 370 486 402 560 416"
            fill="none" stroke="#c6ebd1" stroke-width="2.4"
            stroke-linecap="round" opacity=".6"/>
    </g>

    <g id="hillNearTile">
      <path d="M 0 448
               C 44 418 100 404 158 424
               C 216 444 250 408 307 414
               C 364 420 434 446 520 448
               L 520 540 L 0 540 Z"
            fill="#76c289"/>
      <path d="M 0 448
               C 44 418 100 404 158 424
               C 216 444 250 408 307 414
               C 364 420 434 446 520 448"
            fill="none" stroke="#a7dcb4" stroke-width="2.6"
            stroke-linecap="round" opacity=".7"/>
    </g>

    <g id="spokeSet" fill="none" stroke="#c7d3da" stroke-width="1.15"
       stroke-linecap="round" opacity=".92">
      <line x1="-43.5" y1="0" x2="43.5" y2="0"/>
      <line x1="-43.5" y1="0" x2="43.5" y2="0" transform="rotate(30)"/>
      <line x1="-43.5" y1="0" x2="43.5" y2="0" transform="rotate(60)"/>
      <line x1="-43.5" y1="0" x2="43.5" y2="0" transform="rotate(90)"/>
      <line x1="-43.5" y1="0" x2="43.5" y2="0" transform="rotate(120)"/>
      <line x1="-43.5" y1="0" x2="43.5" y2="0" transform="rotate(150)"/>
      <g transform="rotate(18)">
        <rect x="-2.8" y="-43" width="5.6" height="4.6" rx="1.3"
              fill="#f1b34b" stroke="none"/>
        <rect x="-0.8" y="-42.8" width="1.5" height="2" rx=".7"
              fill="#fff0bd" stroke="none" opacity=".85"/>
      </g>
      <circle cx="0" cy="-42" r="1.1" fill="#9cabb4" stroke="none"/>
    </g>
  </defs>

  <!-- ============ SKY / SUN / CLOUDS ============ -->
  <rect x="0" y="0" width="1000" height="560" fill="url(#skyGrad)"/>

  <circle cx="834" cy="98" r="162" fill="url(#sunHalo)"/>
  <circle cx="834" cy="98" r="43" fill="#fff5c9" opacity=".93"/>
  <circle cx="834" cy="98" r="30" fill="#fffbe8" opacity=".55"/>

  <g id="clouds" fill="none" aria-hidden="true">
    <g class="cloud" data-x="154" data-y="104" data-scale="1.05" data-speed="7"
       transform="translate(154 104) scale(1.05)" opacity=".94">
      <use href="#cloudShape"/>
    </g>
    <g class="cloud" data-x="705" data-y="92" data-scale=".78" data-speed="10"
       transform="translate(705 92) scale(.78)" opacity=".82">
      <use href="#cloudShape"/>
    </g>
    <g class="cloud" data-x="470" data-y="176" data-scale=".46" data-speed="14"
       transform="translate(470 176) scale(.46)" opacity=".64">
      <use href="#cloudShape"/>
    </g>
    <g class="cloud" data-x="942" data-y="169" data-scale=".58" data-speed="8"
       transform="translate(942 169) scale(.58)" opacity=".7">
      <use href="#cloudShape"/>
    </g>
    <g class="cloud" data-x="24" data-y="198" data-scale=".36" data-speed="17"
       transform="translate(24 198) scale(.36)" opacity=".56">
      <use href="#cloudShape"/>
    </g>
  </g>

  <!-- ============ PARALLAX HILLS ============ -->
  <g id="hills" aria-hidden="true">
    <g id="hillFarTrack">
      <use href="#hillFarTile"/>
      <use href="#hillFarTile" x="660"/>
      <use href="#hillFarTile" x="1320"/>
    </g>
    <g id="hillMidTrack">
      <use href="#hillMidTile"/>
      <use href="#hillMidTile" x="560"/>
      <use href="#hillMidTile" x="1120"/>
    </g>
    <g id="hillNearTrack">
      <use href="#hillNearTile"/>
      <use href="#hillNearTile" x="520"/>
      <use href="#hillNearTile" x="1040"/>
    </g>
  </g>

  <!-- ============ ROAD ============ -->
  <g id="road" aria-hidden="true">
    <rect x="0" y="462" width="1000" height="98" fill="url(#roadGrad)"/>
    <path d="M 0 462.5 L 1000 462.5" fill="none" stroke="#e9f2f5"
          stroke-width="2" opacity=".6"/>
    <path d="M 0 467 L 1000 467" fill="none" stroke="#6f7d88"
          stroke-width="1.4" opacity=".22"/>
    <line id="roadDashes" x1="-120" y1="520" x2="1120" y2="520"
          stroke="#f5f0dc" stroke-width="5.5" stroke-linecap="round"
          stroke-dasharray="64 48" opacity=".9"/>
    <path d="M 0 548 L 1000 548" fill="none" stroke="#667480"
          stroke-width="1.5" opacity=".14"/>
    <g fill="#dfe8ed" opacity=".18">
      <ellipse cx="145" cy="500" rx="7" ry="1.5"/>
      <ellipse cx="746" cy="509" rx="9" ry="1.5"/>
      <ellipse cx="892" cy="538" rx="12" ry="1.8"/>
      <ellipse cx="338" cy="544" rx="6" ry="1.2"/>
    </g>
  </g>

  <!-- Contact shadows -->
  <g fill="#284451" opacity=".17" filter="url(#shadowBlur)" aria-hidden="true">
    <ellipse cx="373" cy="493" rx="50" ry="6"/>
    <ellipse cx="661" cy="493" rx="50" ry="6"/>
    <ellipse cx="514" cy="498" rx="214" ry="8" opacity=".42"/>
  </g>

  <!-- ============ BICYCLE / RIDER ============ -->
  <g id="bike">

    <!-- Wheels are exactly 120 px diameter, 288 px apart (2.4 diameters). -->
    <g id="rearWheel" transform="translate(373 432)">
      <circle r="54.5" fill="none" stroke="#353c46" stroke-width="11"/>
      <circle r="59.2" fill="none" stroke="#59636e" stroke-width="1.1" opacity=".45"/>
      <g class="wheelSpin" id="rearSpin">
        <use href="#spokeSet"/>
      </g>
      <circle r="48.5" fill="none" stroke="#d6e0e6" stroke-width="4.2"/>
      <circle r="44.7" fill="none" stroke="#f7fbfd" stroke-width="1.1" opacity=".7"/>
      <circle r="8" fill="#c1ccd4" stroke="#7c8893" stroke-width="1.5"/>
      <circle r="3.1" fill="#6c7883"/>
      <g id="rearCog">
        <circle r="9.5" fill="#7c8893" stroke="#3f4751" stroke-width="2"
                stroke-dasharray="2.1 2.4"/>
        <circle r="4.2" fill="#4a535e"/>
      </g>
    </g>

    <g id="frontWheel" transform="translate(661 432)">
      <circle r="54.5" fill="none" stroke="#353c46" stroke-width="11"/>
      <circle r="59.2" fill="none" stroke="#59636e" stroke-width="1.1" opacity=".45"/>
      <g class="wheelSpin" id="frontSpin">
        <use href="#spokeSet"/>
      </g>
      <circle r="48.5" fill="none" stroke="#d6e0e6" stroke-width="4.2"/>
      <circle r="44.7" fill="none" stroke="#f7fbfd" stroke-width="1.1" opacity=".7"/>
      <circle r="8" fill="#c1ccd4" stroke="#7c8893" stroke-width="1.5"/>
      <circle r="3.1" fill="#6c7883"/>
    </g>

    <!-- Horizontal rear rack: deck sits above the rear wheel. -->
    <g id="rearRack" fill="none" stroke-linecap="round">
      <line x1="345" y1="352" x2="371" y2="430" stroke="#4d5763" stroke-width="6.2" opacity=".65"/>
      <line x1="340" y1="351" x2="372" y2="431" stroke="#5a6572" stroke-width="4.2"/>
      <line x1="398" y1="351" x2="374" y2="431" stroke="#5a6572" stroke-width="4.2"/>
      <path d="M 470 350 L 467 347" stroke="#56616e" stroke-width="5"/>
      <path d="M 460 329 L 468 351" stroke="#5b6673" stroke-width="4.5"/>
      <circle cx="460" cy="329" r="3.4" fill="#454f5b" stroke="none"/>
    </g>
    <g id="rearRackDeck">
      <rect x="322" y="348.5" width="148" height="7.2" rx="3.6" fill="#5a6572"/>
      <rect x="326" y="349.2" width="139" height="2.1" rx="1.05" fill="#aab6c0" opacity=".58"/>
      <rect x="412" y="349.5" width="4.5" height="5.5" rx="1.2" fill="#3f4852" opacity=".55"/>
      <rect x="443" y="349.5" width="4.5" height="5.5" rx="1.2" fill="#3f4852" opacity=".55"/>
      <circle cx="323.5" cy="346" r="3.1" fill="#e26a59"/>
      <circle cx="323.5" cy="345.2" r="1.2" fill="#ffd4ad" opacity=".8"/>
    </g>

    <!-- DeepSeek whale cutout supplied by the user, embedded as a transparent PNG. -->
    <g id="whale" aria-label="一只贴着货架坐着的 DeepSeek 小蓝鲸">
      <ellipse cx="366" cy="350" rx="59" ry="5.5" fill="#203349" opacity=".15"/>

</main>

<script>
(() => {
  "use strict";

  const NS = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // ---------- Bicycle geometry (matches the 1000 x 560 composition) ----------
  const BB = { x: 497, y: 450 };          // bottom bracket, 42 px above ground
  const REAR = { x: 373, y: 432 };
  const FRONT = { x: 661, y: 432 };
  const CRANK = 24;                       // 0.2 x wheel diameter
  const LEG_UPPER = 94;
  const LEG_LOWER = 101;
  const NEAR_HIP = { x: 456, y: 281 };
  const FAR_HIP = { x: 444, y: 279 };

  // ---------- Motion ----------
  const WHEEL_SPEED = 3.0;                // rad / s, clockwise
  const CRANK_SPEED = 1.3;                // rad / s, uniform
  const ROAD_SPEED = 60 * WHEEL_SPEED;    // px / s at the tyre contact
  const SPOUT_PERIOD = 2.6;
  const BASE_CRANK = -0.62;
  const STATIC_TIME = 0.58;

  const el = {
    rearSpin: $("rearSpin"),
    frontSpin: $("frontSpin"),
    chainBase: $("chainBase"),
    chainLinks: $("chainLinks"),
    chainringBolts: $("chainringBolts"),
    roadDashes: $("roadDashes"),
    farCrankArm: $("farCrankArm"),
    nearCrankArm: $("nearCrankArm"),
    nearCrankHighlight: $("nearCrankHighlight"),
    farPedal: $("farPedal"),
    nearPedal: $("nearPedal"),
    farFoot: $("farFoot"),
    nearFoot: $("nearFoot"),
    farThigh: $("farThigh"),
    farShin: $("farShin"),
    nearThigh: $("nearThigh"),
    nearShin: $("nearShin"),
    pelicanTorso: $("pelicanTorso"),
    pelicanHead: $("pelicanHead"),
    spout: $("spout")
  };

  const hillTracks = [
    { node: $("hillFarTrack"), speed: 5.5, width: 660 },
    { node: $("hillMidTrack"), speed: 13.5, width: 560 },
    { node: $("hillNearTrack"), speed: 28, width: 520 }
  ];

  const clouds = Array.from(document.querySelectorAll(".cloud")).map(node => ({
    node,
    x: parseFloat(node.dataset.x),
    y: parseFloat(node.dataset.y),
    scale: parseFloat(node.dataset.scale),
    speed: parseFloat(node.dataset.speed)
  }));

  // ---------- Chain path, computed from the two sprocket centres ----------
  function makeChainPath() {
    const rCog = 9.5;
    const rRing = 20;
    const dx = BB.x - REAR.x;
    const dy = BB.y - REAR.y;
    const d = Math.hypot(dx, dy);
    const phi = Math.atan2(dy, dx);
    const alpha = Math.acos((rCog - rRing) / d);
    const nTop = {
      x: Math.cos(phi - alpha),
      y: Math.sin(phi - alpha)
    };
    const nBottom = {
      x: Math.cos(phi + alpha),
      y: Math.sin(phi + alpha)
    };
    const cogTop = { x: REAR.x + rCog * nTop.x, y: REAR.y + rCog * nTop.y };
    const cogBottom = { x: REAR.x + rCog * nBottom.x, y: REAR.y + rCog * nBottom.y };
    const ringTop = { x: BB.x + rRing * nTop.x, y: BB.y + rRing * nTop.y };
    const ringBottom = { x: BB.x + rRing * nBottom.x, y: BB.y + rRing * nBottom.y };
    const f = n => n.toFixed(2);
    return `M ${f(cogTop.x)} ${f(cogTop.y)}
            L ${f(ringTop.x)} ${f(ringTop.y)}
            A ${rRing} ${rRing} 0 1 1 ${f(ringBottom.x)} ${f(ringBottom.y)}
            L ${f(cogBottom.x)} ${f(cogBottom.y)}
            A ${rCog} ${rCog} 0 0 1 ${f(cogTop.x)} ${f(cogTop.y)} Z`;
  }
  const chainPath = makeChainPath();
  el.chainBase.setAttribute("d", chainPath);
  el.chainLinks.setAttribute("d", chainPath);

  // ---------- Two-bone IK; always choose the knee that points forward (+x) ----------
  function solveLeg(hip, ankle, upper, lower) {
    let dx = ankle.x - hip.x;
    let dy = ankle.y - hip.y;
    let d = Math.hypot(dx, dy) || 0.0001;
    const reach = (upper + lower) * 0.999;
    if (d > reach) {
      const s = reach / d;
      dx *= s;
      dy *= s;
      d = reach;
    }
    const a = clamp((upper * upper - lower * lower + d * d) / (2 * d), 0, upper);
    const h = Math.sqrt(Math.max(0, upper * upper - a * a));
    const ux = dx / d;
    const uy = dy / d;
    const k1 = { x: hip.x + ux * a - uy * h, y: hip.y + uy * a + ux * h };
    const k2 = { x: hip.x + ux * a + uy * h, y: hip.y + uy * a - ux * h };
    return k1.x >= k2.x ? k1 : k2;
  }

  function setLeg(thighNode, shinNode, hip, knee, ankle) {
    thighNode.setAttribute("d",
      `M ${hip.x.toFixed(2)} ${hip.y.toFixed(2)} L ${knee.x.toFixed(2)} ${knee.y.toFixed(2)}`);
    shinNode.setAttribute("d",
      `M ${knee.x.toFixed(2)} ${knee.y.toFixed(2)} L ${ankle.x.toFixed(2)} ${ankle.y.toFixed(2)}`);
  }

  // ---------- The whale spout: a small deterministic burst every 2.6 s ----------
  const spoutSpecs = [
    { delay: 0.00, life: 1.16, rx: 3.3, ry: 5.1, rise: 119, dx: -3.0, sway: 2.5, rot: -5 },
    { delay: 0.03, life: 1.04, rx: 2.5, ry: 4.2, rise: 100, dx: -8.0, sway: 3.0, rot: 8 },
    { delay: 0.06, life: 1.10, rx: 2.2, ry: 3.7, rise: 108, dx: 3.5, sway: 2.2, rot: -10 },
    { delay: 0.08, life: 0.94, rx: 2.7, ry: 4.4, rise: 91, dx: -14.0, sway: 3.2, rot: 12 },
    { delay: 0.10, life: 0.99, rx: 1.8, ry: 3.2, rise: 85, dx: 10.0, sway: 2.8, rot: -4 },
    { delay: 0.13, life: 0.90, rx: 2.4, ry: 4.0, rise: 78, dx: -21.0, sway: 3.4, rot: 15 },
    { delay: 0.15, life: 0.83, rx: 1.55, ry: 2.7, rise: 66, dx: 17.0, sway: 2.0, rot: -15 },
    { delay: 0.17, life: 1.01, rx: 1.9, ry: 3.3, rise: 94, dx: 7.0, sway: 2.5, rot: 6 },
    { delay: 0.20, life: 0.78, rx: 1.5, ry: 2.6, rise: 58, dx: -28.0, sway: 2.1, rot: 18 },
    { delay: 0.22, life: 0.72, rx: 1.25, ry: 2.2, rise: 47, dx: 22.0, sway: 1.7, rot: -18 },
    { delay: 0.12, life: 0.62, rx: 2.2, ry: 3.4, rise: 33, dx: -9.0, sway: 1.5, rot: 8 },
    { delay: 0.16, life: 0.57, rx: 1.8, ry: 2.9, rise: 26, dx: 12.0, sway: 1.4, rot: -6 },
    { delay: 0.25, life: 0.66, rx: 1.15, ry: 2.0, rise: 39, dx: -32.0, sway: 1.4, rot: 22 },
    { delay: 0.27, life: 0.58, rx: 1.1, ry: 2.0, rise: 31, dx: 27.0, sway: 1.2, rot: -22 },
    { delay: 0.31, life: 0.48, rx: 1.0, ry: 1.7, rise: 20, dx: -18.0, sway: .9, rot: 14 },
    { delay: 0.33, life: 0.44, rx: .9, ry: 1.5, rise: 16, dx: 16.0, sway: .8, rot: -12 },
    { delay: 0.40, life: 0.58, rx: 2.2, ry: 3.1, rise: 10, dx: -8.0, sway: 1.0, rot: 5 },
    { delay: 0.46, life: 0.55, rx: 1.55, ry: 2.3, rise: 16, dx: 12.0, sway: 1.2, rot: -8 },
    { delay: 0.34, life: 0.70, rx: 1.2, ry: 1.8, rise: 24, dx: -22.0, sway: 1.4, rot: 12 }
  ];

  const particles = spoutSpecs.map(spec => {
    const node = document.createElementNS(NS, "ellipse");
    node.setAttribute("rx", (spec.rx * 1.32).toFixed(2));
    node.setAttribute("ry", (spec.ry * 1.24).toFixed(2));
    node.setAttribute("cx", "0");
    node.setAttribute("cy", "0");
    node.setAttribute("fill", "url(#waterGrad)");
    node.setAttribute("stroke", "#f7fdff");
    node.setAttribute("stroke-width", ".65");
    node.setAttribute("stroke-opacity", ".7");
    node.setAttribute("opacity", "0");
    el.spout.appendChild(node);
    return { ...spec, rise: spec.rise * 0.76, node };
  });

  const splash = document.createElementNS(NS, "ellipse");
  splash.setAttribute("cx", "0");
  splash.setAttribute("cy", "4");
  splash.setAttribute("rx", "7");
  splash.setAttribute("ry", "2.8");
  splash.setAttribute("fill", "url(#waterGrad)");
  splash.setAttribute("opacity", "0");
  el.spout.insertBefore(splash, particles[0].node);

  function renderSpout(time) {
    const cycle = ((time % SPOUT_PERIOD) + SPOUT_PERIOD) % SPOUT_PERIOD;
    const baseU = clamp(cycle / 0.90, 0, 1);
    const baseOpacity = cycle < 0.90 ? Math.pow(1 - baseU, 1.25) * 0.52 : 0;
    splash.setAttribute("opacity", baseOpacity.toFixed(3));
    splash.setAttribute("rx", (7 + baseU * 9).toFixed(2));
    splash.setAttribute("ry", (2.8 + baseU * 2.8).toFixed(2));
    for (const p of particles) {
      const age = cycle - p.delay;
      if (age <= 0 || age >= p.life) {
        p.node.setAttribute("opacity", "0");
        continue;
      }
      const u = age / p.life;
      const ease = 1 - Math.pow(1 - u, 2.35);
      const x = p.dx * (0.18 + u * 0.92) + Math.sin(u * Math.PI + p.delay * 22) * p.sway;
      const y = -p.rise * ease;
      const stretch = 1 + u * 2.25;
      const widen = 1 + u * 0.18;
      const rot = p.rot * (0.4 + u * 0.6);
      const fadeIn = Math.min(1, age / 0.055);
      const fadeOut = Math.pow(1 - u, 0.78);
      const opacity = fadeIn * fadeOut * 0.97;
      p.node.setAttribute("transform",
        `translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${rot.toFixed(1)}) scale(${widen.toFixed(2)} ${stretch.toFixed(2)})`);
      p.node.setAttribute("opacity", opacity.toFixed(3));
    }
  }

  // ---------- Main frame renderer ----------
  function render(time) {
    const phase = BASE_CRANK + time * CRANK_SPEED;
    const wheelDeg = (time * WHEEL_SPEED * 180 / Math.PI) % 360;
    const crankDeg = (phase * 180 / Math.PI) % 360;
    const bob = 1.35 * Math.sin(phase * 2 + 0.45);
    const nod = 1.2 * Math.sin(phase * 2 + 1.55);

    el.rearSpin.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)})`);
    el.frontSpin.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)})`);

    el.chainringBolts.setAttribute("transform", `rotate(${crankDeg.toFixed(2)})`);
    el.chainLinks.setAttribute("stroke-dashoffset", (((phase * 20) % 7 + 7) % 7).toFixed(2));

    const dashOffset = (time * ROAD_SPEED) % 112;
    el.roadDashes.setAttribute("stroke-dashoffset", dashOffset.toFixed(2));

    for (const track of hillTracks) {
      const shift = (time * track.speed) % track.width;
      track.node.setAttribute("transform", `translate(${(-shift).toFixed(2)} 0)`);
    }

    for (const c of clouds) {
      let x = c.x - c.speed * time;
      const min = -190;
      const span = 1400;
      x = ((x - min) % span + span) % span + min;
      c.node.setAttribute("transform",
        `translate(${x.toFixed(2)} ${c.y}) scale(${c.scale})`);
    }

    // Feet follow the two pedals; the knees are always bent forward.
    const nearPedal = {
      x: BB.x + CRANK * Math.cos(phase),
      y: BB.y + CRANK * Math.sin(phase)
    };
    const farPedal = {
      x: BB.x - CRANK * Math.cos(phase),
      y: BB.y - CRANK * Math.sin(phase)
    };

    const nearAnkle = { x: nearPedal.x - 1.4, y: nearPedal.y - 9.3 };
    const farAnkle = { x: farPedal.x - 1.4, y: farPedal.y - 9.3 };
    const nearHip = { x: NEAR_HIP.x, y: NEAR_HIP.y + bob };
    const farHip = { x: FAR_HIP.x, y: FAR_HIP.y + bob };

    const nearKnee = solveLeg(nearHip, nearAnkle, LEG_UPPER, LEG_LOWER);
    const farKnee = solveLeg(farHip, farAnkle, LEG_UPPER, LEG_LOWER);

    el.nearCrankArm.setAttribute("x2", nearPedal.x.toFixed(2));
    el.nearCrankArm.setAttribute("y2", nearPedal.y.toFixed(2));
    el.nearCrankHighlight.setAttribute("x2", (nearPedal.x - 2).toFixed(2));
    el.nearCrankHighlight.setAttribute("y2", (nearPedal.y - 2).toFixed(2));
    el.farCrankArm.setAttribute("x2", farPedal.x.toFixed(2));
    el.farCrankArm.setAttribute("y2", farPedal.y.toFixed(2));

    el.nearPedal.setAttribute("transform",
      `translate(${nearPedal.x.toFixed(2)} ${nearPedal.y.toFixed(2)})`);
    el.farPedal.setAttribute("transform",
      `translate(${farPedal.x.toFixed(2)} ${farPedal.y.toFixed(2)})`);
    el.nearFoot.setAttribute("transform",
      `translate(${nearAnkle.x.toFixed(2)} ${nearAnkle.y.toFixed(2)})`);
    el.farFoot.setAttribute("transform",
      `translate(${farAnkle.x.toFixed(2)} ${farAnkle.y.toFixed(2)})`);

    setLeg(el.nearThigh, el.nearShin, nearHip, nearKnee, nearAnkle);
    setLeg(el.farThigh, el.farShin, farHip, farKnee, farAnkle);

    el.pelicanTorso.setAttribute("transform", `translate(0 ${bob.toFixed(2)})`);
    el.pelicanHead.setAttribute("transform",
      `translate(0 ${bob.toFixed(2)}) rotate(${nod.toFixed(2)} 509 224)`);

    renderSpout(time);
  }

  // ---------- Reduced-motion handling ----------
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  let rafId = 0;
  let startMs = 0;
  let lastTime = 0;

  function tick(now) {
    rafId = 0;
    lastTime = (now - startMs) / 1000;
    render(lastTime);
    if (!reduce.matches) {
      rafId = requestAnimationFrame(tick);
    }
  }

  function start() {
    if (rafId || reduce.matches) return;
    startMs = performance.now() - lastTime * 1000;
    rafId = requestAnimationFrame(tick);
  }

  function stop() {
    if (rafId) {
      cancelAnimationFrame(rafId);
      rafId = 0;
    }
  }

  function onMotionPreferenceChange() {
    if (reduce.matches) {
      stop();
      lastTime = STATIC_TIME;
      render(STATIC_TIME);
    } else {
      start();
    }
  }

  render(STATIC_TIME);
  lastTime = STATIC_TIME;
  if (!reduce.matches) start();
  if (reduce.addEventListener) reduce.addEventListener("change", onMotionPreferenceChange);
  else if (reduce.addListener) reduce.addListener(onMotionPreferenceChange);
})();
</script>
</body>
