<svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="680" height="420" fill="#fafbfc"/>
  <rect x="50" y="50" width="560" height="260" fill="#ffffff" stroke="#e3e6ea"/>
  <path d="M80,265 C160,258 220,240 300,205 C400,162 480,120 580,100" fill="none" stroke="#4a6fa5" stroke-width="3"/>
  <text x="62" y="135" font-size="13" fill="#666">收益率 ↑</text>
  <text x="90" y="295" font-size="12" fill="#888">3个月</text>
  <text x="215" y="295" font-size="12" fill="#888">2年</text>
  <text x="330" y="295" font-size="12" fill="#888">5年</text>
  <text x="445" y="295" font-size="12" fill="#888">10年</text>
  <text x="545" y="295" font-size="12" fill="#888">30年</text>
  <rect x="60" y="55" width="160" height="250" fill="#dcedc8" opacity="0.45"/>
  <text x="72" y="75" font-size="12.5" fill="#388e3c" font-weight="bold">Fed 现在买（RMP）</text>
  <text x="72" y="92" font-size="11.5" fill="#388e3c">只买短端国库券 T-Bills</text>
  <text x="72" y="109" font-size="11.5" fill="#388e3c">名义上"储备管理"，不是QE</text>
  <rect x="280" y="55" width="310" height="250" fill="#fdecea" opacity="0.5"/>
  <text x="295" y="75" font-size="12.5" fill="#c0392b" font-weight="bold">"接长端" = Fed 买这里</text>
  <text x="295" y="92" font-size="11.5" fill="#c0392b">2年~30年期中长期国债</text>
  <text x="295" y="109" font-size="11.5" fill="#c0392b">实质就是 QE / 类YCC</text>
  <circle cx="452" cy="135" r="5" fill="#c0392b"/>
  <text x="460" y="130" font-size="12" fill="#c0392b" font-weight="bold">10Y = 5.05%（99%分位）</text>
  <text x="460" y="146" font-size="11" fill="#c0392b">财政利息 $1.36万亿/年，扛不住</text>
  <path d="M330,175 L430,150" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#ar)"/>
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#c0392b"/></marker></defs>
  <text x="335" y="190" font-size="11.5" fill="#c0392b">终极一步：Fed 成为长端买家</text>
  <text x="335" y="206" font-size="11.5" fill="#c0392b">压低收益率 = 给财政续命</text>
  <rect x="50" y="330" width="560" height="70" rx="8" fill="#fff8e1" stroke="#f0d080"/>
  <text x="68" y="352" font-size="12.5" fill="#8a6d1a" font-weight="bold">为什么迟早要接：财政利息已超国防 → 每次发长债都要市场要价 5%+</text>
  <text x="68" y="372" font-size="12" fill="#8a6d1a">市场买不动 → 只能 Fed 印钱买 → 长端利率被行政压低 = 贴现率均值回归</text>
  <text x="68" y="390" font-size="12" fill="#8a6d1a">对资产：压低一切长久期资产折现率 → 黄金/有色金属估值弹性最大</text>
</svg>
